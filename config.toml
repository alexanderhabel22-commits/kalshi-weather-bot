max_markets_per_event = 2
min_price = 0.85                 # favorite-side price band
max_price = 0.96
min_hours = 1                    # market closes 1 hour - 24 hours from now
max_hours = 24                   # 168 -> 24 Nov 13 (Alex: "implement if you think it is smart"). Entry-timing
                                 # replay: last-24h bids +4.6c/fill vs +2.0c for the 7-day window (reachable
                                 # markets, ~20% fewer fills). Orders already resting stay until they fill or close.
max_open_pct = 0.30              # at most 30% of the bankroll in this strategy
max_event_pct = 0.15             # at most 15% on one event (was 10%; room for 2 markets at 4 contracts)

[trading.favorites_wide]
# 1-CONTRACT REAL-MONEY TEST since Nov 12 (main-bot audit): the favorites bet on markets the live rule skips
# because their listed close is far out, though Kalshi expects the result within 7 days (most election
# markets). Same band, categories and event-volume floor; 1 contract. Never live without Alex's OK.
max_week_contracts = 2000
max_market_contracts = 200
enabled = true
live = true                      # REAL money, 1 contract test (Alex Nov 12 2:38 PM ET: "ok testing with real money")
categories = ["Elections", "Politics", "Entertainment"]
min_event_volume = 1000000
contracts = 1
max_contracts = 1
max_markets_per_event = 2
min_price = 0.85
max_price = 0.96
min_hours = 1                    # expected decision 1 hour - 7 days from now
max_hours = 168
max_open_pct = 0.20
max_event_pct = 0.05

[trading.favorites_late]
# PAPER SHADOW ONLY (Nov 13, 2026, thread "Check entry timing in main-bot strategies"): the live
# favorites rule above, but bidding only in the LAST 24 HOURS before close (wxbot/strats/favorites_late.py).
# Replay Jan 2025-Nov 2026 on the markets the bot can reach: +4.6c per fill vs +2.0c for the live
# rule, ~20% fewer fills. Logs 1-contract paper orders, also on markets the live rule holds.
# Decide at the favorites 500-contract review whether the live rule should wait like this.
# Never live without Alex's OK.
max_week_contracts = 2000
