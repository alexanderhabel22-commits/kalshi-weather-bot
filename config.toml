[trading.locks]
# Weather LOCKs, PAPER for now. Alex OK'd real money on Nov 5, then paused it the
# same evening after a bad 6-hour METAR group made a false Philadelphia LOCK.
# Flip live = true (and [trading] mode = "live") only with Alex's go. The day's readings already
# decide the bracket. Buys at the live ask (immediate-or-cancel, never rests)
# while fair 99.5% - ask - taker fee >= [strategy] min_edge_lock and the ask is
# <= max_price_lock. Size = the alert's Kelly sizing (max_bet_frac_lock of the
# bankroll), then the 20% per-event and 75% live caps, the loss stops and the
# cash in the account. Record: 215 locked brackets Nov 3-5, only 1 below 97c.
enabled = true
live = false                     # PAPER until Alex says go again
taker = true                     # allowed to take the ask (other strategies only rest bids)
exit = "hold"                    # hold to settlement (settles next morning)
contracts = 10                   # never more than 10 contracts on one lock
min_price = 0.20                 # a "lock" the market prices under 20c is more likely our data error
max_price = 0.97
max_signal_minutes = 15          # act only on the latest scan's locks
max_week_contracts = 500
max_market_contracts = 50
max_event_pct = 0.20             # at most 20% of the bankroll on one city-day

[trading.weather]
# Day-before weather limit orders (mirrors the paper orders). Real-money test
# Nov 5-11: 43 contracts settled, -$3.95. BACK TO PAPER Nov 11 (research_wx/RESULTS.md):
# the market's own forecast is now more accurate than the model, so the edge is ~0.
# Orders already resting or filled finish on their own. Re-check Jan-Feb.
max_week_contracts = 4000        # fair share of the flow (scale study)
max_market_contracts = 50        # per-market ceiling (scale study)
enabled = true
live = false                     # paper since Nov 11 (was a real-money test Nov 5-11)
contracts = 1
max_open_pct = 0.15             # small test: at most 15% of the bankroll (~$7.50)
max_event_pct = 0.15
exit = "model"                   # sell ~12h before close only if the fresh forecast says the bid is worth 8c+ more than holding
exit_margin = 0.08

[trading.weather_late]
# Late-day lows (wxbot/strats/weather_late.py, research_wx/RESULTS.md): from about noon on,
# buy NO 1c inside the offer on LOW brackets below the low already recorded (spread 4c+),
# hold to settlement. Backtest +5.7c per contract (Oct 2025-Aug 2026), +3.7c (Sep-Nov 2026).
# REAL money since Nov 11 (Alex's OK), replacing the day-before weather test.
# Reviews at 100/300/500 contracts like every live market; freeze applies until 500.
enabled = true
live = true
contracts = 1                    # per order; raise only at a review
contracts_by = { "low/need" = 2 }  # late-day LOWS 1 -> 2 (Alex Nov 12 10:41 PM ET "sure do it"); highs/holds stay 1
metrics = ["low", "high"]        # highs added Nov 12 as a 1-contract real test (backtest: cool season only)
kinds = ["need", "holds"]        # "holds" (YES on the bracket holding the extreme) added Nov 12, 1-contract test
# Nov 13 (thread "Expand late-day weather to more markets", Alex: "start em up with real money"):
# 16 more cities' LOW markets added (wxbot/stations.py). Replay Sep 1-Nov 12 on them:
# lows need +3.9c/ct (932 fills), lows holds +4.2c (408). They start at 1 contract.
# Highs "need" replays at ~0 (+0.8c on the 20 old cities, -2.7c on the 3 new ones) and was
# crowding the 15% cap, so it goes back to paper; the 3 new HIGH series stay paper too.
skip = ["high/need", "KXHIGHTEWR", "KXHIGHTTTN", "KXHIGHTSAN"]
sub_loss_stop = { "high/holds" = 3.0 }  # Nov 14: late-day HIGH holds goes paper once its real result hits -$3 (one push); lows untouched
series_contracts = { KXLOWTATL = 1, KXLOWTBOS = 1, KXLOWTDAL = 1, KXLOWTDC = 1, KXLOWTHOU = 1, KXLOWTLV = 1, KXLOWTMIN = 1, KXLOWTNOLA = 1, KXLOWTOKC = 1, KXLOWTPHX = 1, KXLOWTSAN = 1, KXLOWTSATX = 1, KXLOWTSEA = 1, KXLOWTSFO = 1, KXLOWTEWR = 1, KXLOWTTTN = 1 }
max_open_pct = 0.40              # 15% -> 40% (Alex Nov 13 12:31 AM ET, decision card): room for 23 cities' late-day orders
max_event_pct = 0.08             # one city-day
max_loss_pct = 0.10              # own stop: down 10% of the bankroll on this strategy -> no new orders
exit = "hold"                    # the tested rule holds to settlement
max_week_contracts = 4000
max_market_contracts = 50

[trading.rain_evening]
# Evening "no rain yet" fade on daily rain markets (wxbot/strats/rain_evening.py,
# research_new/RESULTS.md). After 8 PM local, if the airport has recorded no measurable
# rain today, buy NO at the ask in the 75-95c band and hold. Replay Jul 16-Nov 12 2026
# (exact trades, after taker fee): +6.1c +- 3.9 per contract, 109 trades, both halves
# positive. ~1 trade a day. 1-CONTRACT REAL test from Nov 13 under Alex's Nov 12 OK for
# new ideas that clear +3c ("if you are confident... start em up with real money").
# Reviews at 100/300/500 contracts; freeze applies until 500.
enabled = true
live = true
taker = true                     # the tested rule takes the ask (fee ~1c)
contracts = 1
max_contracts = 1
min_price = 0.75
max_price = 0.95
start_hour = 20                  # local time window for entries
end_hour = 22
max_markets_per_day = 8
max_open_pct = 0.15              # at most 15% of the bankroll (~$7.50)
max_event_pct = 0.15             # one KXRAIN event = all cities for one day
max_loss_pct = 0.10              # own stop: down 10% of the bankroll on this strategy -> no new orders
exit = "hold"
max_week_contracts = 100
max_market_contracts = 1

[trading.spx_range]
# Sell overpriced S&P 500 daily-close ranges before the open (wxbot/strats/spx_range.py,
# research_spx/RESULTS.md). KXINX 25-point ranges priced 30c+ before 9:30 AM ET are
# overpriced (max fair ~15-20%). Rest a NO bid at 65c (= sell YES at 35c) on the 6 most
# likely ranges of the next close, ~4:05 PM ET to 8:30 AM ET; take a YES bid of 35c+
# directly. Every resting order is cancelled at 8:45 AM ET, before the open.
# Replay Feb 2025-Nov 2026, back-of-queue fills: +12.8c per fill, 293 fills, 21% lose,
# all four periods positive. ~14 fills a month. 1-CONTRACT REAL test from Nov 13
# (Alex, Nov 13 10:13 AM ET decision card: "Yes, 1 contract real").
# Reviews at 100/300/500 contracts; freeze applies until 500.
enabled = true
live = true
taker = true                     # a YES bid already at 35c+ is taken (buy NO at its ask)
contracts = 1
max_contracts = 1
sell_yes = 0.35
n_markets = 6
min_price = 0.40                 # NO price band (taker NO when YES bid is 35-60c)
max_price = 0.65
max_open_pct = 0.10              # 6 resting NO bids at 65c = $3.90
max_event_pct = 0.10
max_loss_pct = 0.10              # own stop: down 10% of the bankroll on this strategy -> no new orders
exit = "hold"
max_week_contracts = 100             # ~6 resting a night count as placed, even when cancelled unfilled
max_market_contracts = 1

[allocator]
# Grades every strategy on profit per $1 risked (settled REAL-money results only,
# bets on one event counted together, longshots trusted less because
# they are noisier) and re-sizes them once a week (Alex, Nov 7). Never switches
# a strategy off. See wxbot/allocator.py. Grades show in REPORT.md.
enabled = true
apply = false          # SHADOW: report only. true = scale live sizes (needs Alex's OK)
hurdle = 0.03          # assume +3c per $1 until a strategy's record says otherwise
prior_sd = 0.035       # ~100 settled favorite-style events = halfway to its own record
floor = 0.25           # never below 1/4 of normal size (keeps building a record)
ceiling = 2.0          # never above 2x normal size
max_step = 0.25        # largest change per re-grade
regrade_days = 7
paper_weight = 0.0     # real money only (Alex, Nov 7); paper is a sandbox for new ideas

[m15]
# Always-on 15-minute longshot fade (wxbot/m15.py), runs on its own small server, not in
# GitHub Actions. Research (Nov 8): owning the 71-95c favourite as a resting maker bid,
# back-of-queue fills, earned BTC +7.3c, silver/copper +5.2c, alt crypto +3.1c per contract.
# Expect less live (fast pros; stale quotes), so: 1 contract, small pool, jump guard.
# The server pulls this file every hour and restarts if it changed.
mode = "live"                    # off | paper | live. LIVE from the start (Alex, Nov 8: "this is the
                                 # test", no paper run). Without a Kalshi key on the server it stays
                                 # paper. The repo kill switch TRADING_MODE=off stops it too (~10 min).
live_series = ["KXBTC15M"]   # real money only on these. Nov 13 (Alex: E2 "we can put it on real"): BTC only, under rule E2 at 1 ct; silver stays PAPER (no edge, Nov 12). Before: GOLD back to PAPER Nov 11 3:40 PM ET (Alex: "find a profitable way or cut it"; live -3.8c/ct on 84 ct, no gold rule with an honest edge). Was: GOLD live Nov 11 12:50 AM ET (Alex OK, 1 ct + same 2nd-contract rule; review at 100 fills, paper if < -5c). Nov 10 12:15 PM ET (Alex, trim
                                 # decision): copper, palladium, platinum, WTI back to PAPER, all red
                                 # all-time (-$18.59 on 469 ct) vs BTC+silver +$14.23. They keep logging.
                                 # platinum + WTI live Nov 9 ~1:30 PM ET (Alex OK), 1 contract, last 5 min,
                                 # double-ups on like the others (Alex, Nov 9: judge them the same way).
                                 # palladium live Nov 9 (Alex OK). Timing test: last 5 min 10:30 AM-1 PM ET
                                 # (-$2.81, 10 windows), whole window again from ~2 PM ET; Claude picks
                                 # the better one at 7:30 PM ET (Alex, Nov 9).
contracts = 1                    # per market
extra_contracts = 1              # ON Nov 8 5:15 PM ET (Alex OK'd): +1 contract while the
extra_min = 0.80                 # favourite is 80-87c (backtest +11c/ct; live the bot buys at ~73c
extra_max = 0.87                 # then sits out this stretch). Max 2 per market.
single_series = []               # series listed here never take the extra contract
# correlated group: once group_cap of these filled in a window, the others stop bidding there.
# 0 = off. Built Nov 10 for Alex's 3:30 PM ET review (12:15 AM ET window: 5 of 6 lost together).
# Alex (Nov 10 ~1 AM ET): turn the window guard OFF. It shrank to ~$2.60 of room after the
# 12:15 AM loss and held back most bets overnight. The -10%/day pause and -12.5% halt stay.
stop_guard = false
group = ["KXCOPPER15M", "KXPALLADIUM15M", "KXPLATINUM15M", "KXGOLD15M", "KXWTI15M"]
group_cap = 2                    # Nov 10 ~1 AM ET: max 2 of the weaker metals/oil per window; silver (proven) is exempt so palladium's whole-window bids can't crowd it out
