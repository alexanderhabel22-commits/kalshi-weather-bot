# Kalshi weather alert bot settings. Edit and commit; the next scan picks it up.

[account]
bankroll = 49.71                 # fallback only: the bot reads the live Kalshi balance
auto_bankroll = true             # bankroll = Kalshi cash + open positions, read every trade run
timezone = "America/New_York"    # for quiet hours and the daily summary
risk_level = "normal"            # "normal" or "aggressive" (see [strategy_aggressive])
nws_contact = ""                 # optional: weather.gov asks bots to include a contact

[markets]
include_lows = true              # daily LOW markets too (7 cities)
max_days_ahead = 1               # 0 = today only, 1 = today + tomorrow
series = []                      # e.g. ["KXHIGHNY", "KXHIGHCHI"] to limit; empty = all
skip_cities = []                 # e.g. ["Denver"]
auto_discover = true             # pick up new/renamed weather series from Kalshi daily
rain_census = false              # silent test Nov 4-11, 2026: all 14 passed thresholds were already $1.00; off
paper_daybefore = true           # paper-trade day-before limit orders (no money, no alerts)
paper_late = true                # paper test: late-day orders on today's lows/highs (no money; wxbot/latepaper.py)
launch_watch = true              # watch for brand-new Kalshi series/categories (data/launches.json)

[strategy]
# Edges are in dollars per contract after fees (0.03 = 3¢).
min_edge_lock = 0.03             # observations already decide the bracket
min_edge_model = 0.07            # forecast-based call
day_ahead_extra_edge = 0.03      # extra edge required for tomorrow's markets
market_blend = 0.25              # shrink model toward the market price (humility)
max_model_disagreement = 0.35    # ignore if model and market differ by more than this
min_price_model = 0.10           # no forecast-based longshots below 10¢
max_price_model = 0.95
max_price_lock = 0.97
kelly_fraction = 0.25            # quarter Kelly
max_bet_frac_lock = 0.10         # max 10% of bankroll on one lock
max_bet_frac_model = 0.05        # max 5% on one forecast call
max_event_frac = 0.12            # max 12% on one city-day
max_open_frac = 0.40             # max 40% of bankroll open at once
min_expected_profit = 0.02       # skip alerts worth less than 2¢ expected
near_min_prob = 0.95             # near-lock: model must rate our side at least 95%...
near_max_hours = 9               # ...with at most 9 hours left in the climate day...
near_min_price = 0.80            # ...priced 80¢-97¢ (max_price_lock)...
min_edge_near = 0.02             # ...and 2¢+ edge after fees, blended with the market

[strategy_aggressive]
# Used instead of the matching [strategy] values when risk level is "aggressive"
# (GitHub variable RISK_LEVEL=aggressive, or risk_level below). Only LOCK sizing
# gets bigger; forecast (EDGE) calls stay small until they prove themselves.
kelly_fraction = 0.5             # half Kelly
max_bet_frac_lock = 0.20         # up to 20% on one lock
max_event_frac = 0.25            # up to 25% on one city-day
max_open_frac = 0.60             # up to 60% open at once
min_edge_lock = 0.02             # take locks with 2¢+ edge after fees

[alerts]
quiet_start = 0                  # no alerts from midnight...
quiet_end = 7                    # ...to 7 AM (local)
quiet_allows_locks = false
summary_hour = 21                # daily summary / heartbeat after 9 PM
max_alerts_per_day = 15
realert_edge_gain = 0.05         # re-alert the same contract only if edge grows 5¢+
edge_alerts = "off"           # off since Nov 5 (95 silent calls: -$22, market beats it). "shadow" = log + grade silently,
                                 # "on" = send them, "off" = ignore. LOCK alerts always send.
near_lock_alerts = "shadow"      # late-day calls the model rates 95%+ but readings haven't
                                 # decided yet ("near-locks"): same shadow / on / off choice.
launch_alerts = "shadow"         # new-market watcher: "shadow" = log + report only, "on" = also push
                                 # a short note when a new category or a new weather series opens
                                 # its first markets (max 4 a day, not in quiet hours)
# The ntfy topic is read from the NTFY_TOPIC environment variable / GitHub secret.

[model]
ensemble_models = "gfs025,ecmwf_ifs025,icon_seamless,gem_global"
forecast_cache_minutes = 90
samples = 20000
sigma_base = 1.0
sigma_per_hour = 0.045
spread_inflation = 1.15

[trading]
# Automatic orders (wxbot/trader.py, run after each scan by the trade workflow).
# mode: "off" = kill switch, "paper" = record only (no money), "live" = real
# orders with the Kalshi API key. The GitHub variable TRADING_MODE overrides this.
# Even in "live", a strategy only trades real money once its own table says
# live = true (it passed its paper test and Alex said go); otherwise paper.
# New edge = a module in wxbot/strats/ (NAME + propose) + a [trading.<NAME>] table.
mode = "live"                    # REAL money since Nov 5 7 PM ET (Alex's OK) for the strategies
                                 # whose table says live = true: mentions, favorites, macro_fade,
                                 # weather_late (late-day lows, Nov 11). Weather day-before back
                                 # to paper Nov 11. LOCKs stay paper. KILL SWITCH: set the GitHub
                                 # variable TRADING_MODE to off (Settings > Secrets and variables
                                 # > Actions > Variables), or paper to go back to paper.
max_contracts_per_order = 10     # hard per-order size limit (each strategy's own size is smaller)
max_orders_per_run = 40           # per 5-min run (caps still apply); a run also stops placing after run_budget_s
# Limits scale with the bankroll ([account] bankroll or the BANKROLL variable):
max_open_pct = 1.00              # live: whole bankroll may be at risk (Alex, Nov 12 10:38 PM ET; was 75%). Cash check still applies
max_event_pct = 0.20             # any strategy: at most 20% on one event, unless its table sets less
# Capacity (scale study, Nov 5): as the bankroll grows, never take more than 10%
# of a market's traded volume (at least 50, at most 1,000 contracts per market).
# Each strategy also has a weekly contract ceiling (max_week_contracts) = its
# fair share of the flow; sizes shrink to fit instead of moving the market.
max_volume_share = 0.10
min_market_contracts = 50
max_market_contracts = 1000
paper_max_open_pct = 1.00        # paper: may use the whole bankroll (strategy caps still apply)
daily_loss_pct = 0.10            # down 10% today: no new orders until tomorrow
total_loss_pct = 0.25            # down 25% overall: HALT, cancel all resting orders
reset_halt = false               # set true (once) to clear a halt after checking why

[trading.mentions]
# Mentions NO limit orders (research: about +4c per filled contract over 21 months).
max_week_contracts = 5000        # fair share of the flow (scale study)
max_market_contracts = 200       # per-market ceiling (scale study)
enabled = true
live = false                     # PAPER since Nov 12 (Alex: "whatever you recommend"; audit: ~0c edge last 90 days)
contracts = 4                    # max contracts per word (6 -> 4 Nov 9, Alex OK: one topical word, Paramount
                                 # "Netflix", put ~9% of the bankroll at risk; Kelly turns negative ~11%/word)
word_pct = 0.07                  # size each word at 7% of the bankroll (~4 contracts at $55; was 10%);
                                 # raise `contracts` as the bankroll grows
max_words_per_event = 3
min_price = 0.75                 # NO price band
max_price = 0.90
min_hours = 1                    # event (speech, broadcast) happens 1-168 hours from now
max_hours = 168                  # research scored fills at any time before the event
min_volume = 1000                # contracts traded so far (Nov 5 walk-forward: busier words
                                 # paid more in 10 of 14 months; see research_mn/)
max_open_pct = 0.50              # at most 50% of the bankroll in Mentions
max_event_pct = 0.20             # at most 20% of the bankroll on one event (one speech)
# SHADOW AI score (Nov 10, wxbot/mentions_ai.py): Haiku 5.5 + web search guesses how likely each word is
# said and logs it (note column + data/mentions_ai.csv). Changes NO bets. Needs the ANTHROPIC_API_KEY
# secret. Judge at the Dec 3 Mentions review: python bot.py mentions-ai

[trading.mentions_wide]
# PAPER SHADOW ONLY (Nov 10, 2026, leaderboard study): the same Mentions NO bet spread over more
# words. Logs 1-contract paper orders on the words the live rule above leaves out (more than 3 per
# event, or 100-999 contracts traded). Never live before the Dec 3 Mentions verdict, and then only
# with Alex's OK. Compare it with `mentions` at the Dec 3 review.
max_week_contracts = 2000
max_market_contracts = 200
enabled = true
live = false                     # keep false: paper only
contracts = 1
max_words_per_event = 20
min_price = 0.75
max_price = 0.90
min_volume = 100
max_open_pct = 0.40              # leave paper room for the weather LOCK census
max_event_pct = 0.10

[trading.macro_fade]
# Fade longshots in Fed and CPI/PCE markets: resting NO at 71-95c (YES 5-29c).
# Research: +5-12c per filled contract after maker fees, Feb 2025-Oct 2026, but
# few independent releases, so one surprise can hit a whole event. Paper only.
max_week_contracts = 4000        # fair share of the flow (scale study)
max_market_contracts = 1000      # per-market ceiling (scale study)
enabled = true
live = true                      # REAL money (Alex, Nov 5 7 PM ET)
series = ["KXFED", "KXFEDDECISION", "KXCPI", "KXCPIYOY", "KXCPICORE", "KXPCECORE"]
contracts = 3                    # 1 -> 3 Nov 12 (Alex OK; audit +8.7c/fill after fees)
max_contracts = 3
max_markets_per_event = 3
min_price = 0.71                 # NO price band
max_price = 0.95
min_hours = 1                    # market closes 1 hour to 21 days from now
max_hours = 504
min_volume = 500
max_open_pct = 0.30              # at most 30% of the bankroll in this strategy
max_event_pct = 0.10             # at most 10% on one release / one Fed meeting

[trading.ai_fade]
# The Fed/CPI fade rule on Kalshi's weekly "Best AI" market (KXLLM1): resting NO at 71-95c.
# Replay Feb 2025-Nov 2026: +5.1c +- 1.8 per fill, 85 fills, 40/43 events positive (see
# wxbot/strats/ai_fade.py and analysis/fade-events/RESULTS.md). ~4 fills a month, often none.
# REAL money from Nov 14 (Alex: "+5c is +5c let's add it"). 3 contracts: one upset ~ -$2.80.
# Median ~590 contracts traded at our price per order, so size is bankroll-limited, not market-limited.
max_week_contracts = 200
max_market_contracts = 50
enabled = true
live = true
series = ["KXLLM1"]
contracts = 3
max_contracts = 3
max_markets_per_event = 2
min_price = 0.71
max_price = 0.95
min_hours = 2                    # replay used 2 h - 21 days before close (closes 10 AM ET)
max_hours = 504
min_volume = 500
max_open_pct = 0.15
max_event_pct = 0.10

[trading.macro_wide]
# 1-CONTRACT REAL-MONEY TEST since Nov 12 (was paper): the macro_fade rule on weekly gas prices and weekly jobless
# claims (replay Nov 2025-Nov 2026: +6.6c +- 2.7 per fill, ~8 events a month; see
# wxbot/strats/macro_wide.py). Never live without Alex's OK.
max_week_contracts = 1000
max_market_contracts = 100
enabled = true
live = true                      # REAL money, 1 contract test (Alex Nov 12 2:38 PM ET: "ok testing with real money")
series = ["KXAAAGASW", "KXJOBLESSCLAIMS"]
contracts = 1
max_contracts = 1
max_markets_per_event = 3
min_price = 0.71
max_price = 0.95
min_hours = 1
max_hours = 504
min_volume = 500
max_open_pct = 0.20
max_event_pct = 0.05

[trading.favorites]
# Resting bids on the 85-96c favorite in BIG Elections / Politics / Entertainment
# events (research: about +3.7c per filled contract in events with 1M+ contracts
# traded, Feb 2025 - Oct 2026; small events lost). Paper test first.
max_week_contracts = 8000        # fair share of the flow (scale study)
max_market_contracts = 1000      # per-market ceiling (scale study)
enabled = true
live = true                      # REAL money (Alex, Nov 5 7 PM ET)
categories = ["Elections", "Politics", "Entertainment"]
min_event_volume = 1000000       # contracts traded so far across the event's markets
min_series_volume = 1000000      # only look at series that have traded 1M+ contracts in total
