name: cc-lag

# Research only: how late trades reach Kalshi's public social feed (Copycat delay).
# Read-only public data; never trades, never alerts. Runs only on push to this research branch.
on:
  push:
    branches: ["claude/project-thread-xedg3d"]
    paths: ["research_cc/lag.py", ".github/workflows/cc-lag.yml"]

permissions:
  contents: read

concurrency:
  group: cc-lag
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research_cc/lag.py 240
