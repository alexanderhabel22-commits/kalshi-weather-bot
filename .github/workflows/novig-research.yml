name: novig-research

# Research only (Nov 11 2026): Novig public daily trade data vs Kalshi prices.
# Read-only public data; never trades, never alerts. Runs only on push to this branch.
# Output goes to the novig-research-data branch.
on:
  push:
    branches: ["claude/project-thread-dai3uy"]
    paths: ["research_novig/*.py", ".github/workflows/novig-research.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: novig-research
  cancel-in-progress: false

jobs:
  # one research job at a time: wait (first come, first served) for research runs
  # started before this one, so two waiting runs never wait on each other
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for earlier research runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          me=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          for i in $(seq 1 175); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=100" \
                  --jq "[.workflow_runs[] | select((.name | endswith(\"research\")) and .id != ${{ github.run_id }} and .created_at < \"$me\")] | length")
            [ "$n" = "0" ] && exit 0
            echo "earlier research runs in progress: $n"; sleep 120
          done
          exit 1
  run:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_novig/run.py out
      - name: Save to novig-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d-%H%M)"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6; do
            if git fetch origin novig-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/novig-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && rm -rf "runs/$stamp" && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "research output $stamp" || exit 0
            git push origin HEAD:novig-research-data && exit 0
            sleep $((i * 7))
          done
          exit 1
