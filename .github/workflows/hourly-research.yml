name: hourly-research

# Research only (Kalshi hourly temperature markets). Read-only public data;
# never trades, never alerts. Runs when research/ changes on a claude/ branch,
# or by hand. Results are uploaded as a run artifact.
on:
  push:
    branches: ["claude/**"]
    paths: ["research/**", ".github/workflows/hourly-research.yml"]
  workflow_dispatch:
    inputs:
      script:
        description: "research script to run"
        default: "research/hourly_probe.py"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python "${{ inputs.script || 'research/run.py' }}" out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-out
          path: out
          retention-days: 14
