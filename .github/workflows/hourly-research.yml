name: hourly-research

# Research only (Kalshi hourly temperature markets). Read-only public data;
# never trades, never alerts. Runs when research/ changes on a claude/ branch,
# or by hand. Results go to the hourly-research-data branch.
on:
  push:
    branches: ["claude/**"]
    paths: ["research/**", ".github/workflows/hourly-research.yml"]
  workflow_dispatch:
    inputs:
      script:
        description: "research script to run"
        default: "research/hourly_probe.py"

permissions:
  contents: write

concurrency:
  group: hourly-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python "${{ inputs.script || 'research/run.py' }}" out
      - name: Save to hourly-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          if git fetch origin hourly-research-data 2>/dev/null; then
            git checkout -q -B data origin/hourly-research-data
          else
            git checkout -q --orphan data && git rm -rq --cached . || true
          fi
          git clean -fdxq
          mkdir -p runs && cp -r "/tmp/keep/$stamp" "runs/$stamp"
          git add runs
          git commit -qm "research output $stamp" || exit 0
          git push origin HEAD:hourly-research-data
