name: tests

# Runs the test suite and pyflakes on every pull request and on code pushed to main.
# The 15-minute bot's server pulls main every hour and trades real money on it, and
# several threads merge in parallel, so two changes that each pass alone can break
# together. This catches that within a minute. Data-only commits don't trigger it.

on:
  pull_request:
    paths: ["wxbot/**", "tests/**", "bot.py", "config.toml", "requirements*.txt", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["wxbot/**", "tests/**", "bot.py", "config.toml", "requirements*.txt", ".github/workflows/tests.yml"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-m15.txt pytest pyflakes
      - run: python -m pyflakes wxbot bot.py tests
      - run: python -m pytest -q
