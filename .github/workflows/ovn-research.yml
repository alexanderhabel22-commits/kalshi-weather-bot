name: ovn-research

# Research only (overnight idea search, Nov 11 2026): incentive programs, open-event
# overround, public-trader track records, combo (MVE) tapes. Read-only public data;
# never trades, never alerts. Runs only on push to this research branch.
# Output goes to the ovn-research-data branch.
on:
  push:
    branches: ["claude/project-thread-bdmif3"]
    paths: ["research_ovn/probe.py", ".github/workflows/ovn-research.yml"]

permissions:
  contents: write

concurrency:
  group: ovn-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_ovn/probe.py out
      - name: Save to ovn-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d-%H%M)"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6; do
            if git fetch origin ovn-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/ovn-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && rm -rf "runs/$stamp" && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "research output $stamp" || exit 0
            git push origin HEAD:ovn-research-data && exit 0
            sleep $((i * 7))
          done
          exit 1
