name: src-research

# Research only (data-settled markets: settlement sources, price jumps, raw-source
# timestamps). Read-only public data; never trades, never alerts. Runs only on push
# to this research branch. Output goes to the src-research-data branch.
on:
  push:
    branches: ["claude/project-thread-lj6ffi"]
    paths: ["research_src/probe.py", ".github/workflows/src-research.yml"]

permissions:
  contents: write

concurrency:
  group: src-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_src/probe.py out
      - name: Save to src-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d-%H%M)"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6; do
            if git fetch origin src-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/src-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && rm -rf "runs/$stamp" && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "research output $stamp" || exit 0
            git push origin HEAD:src-research-data && exit 0
            sleep $((i * 7))
          done
          exit 1
