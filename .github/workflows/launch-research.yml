name: launch-research

# Research only (new Kalshi series launches). Read-only public data; never
# trades, never alerts. Runs on push to this research branch only. Output goes
# to the launch-research-data branch.
on:
  push:
    branches: ["claude/project-thread-40j0oc"]
    paths: ["research_launch/launch_fetch.py", ".github/workflows/launch-research.yml"]

permissions:
  contents: write

concurrency:
  group: launch-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_launch/launch_fetch.py out
      - name: Save to launch-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          if git fetch origin launch-research-data 2>/dev/null; then
            git checkout -q -B data origin/launch-research-data
          else
            git checkout -q --orphan data && git rm -rq --cached . || true
          fi
          git clean -fdxq
          mkdir -p runs && cp -r "/tmp/keep/$stamp" "runs/$stamp"
          git add runs
          git commit -qm "launch research output $stamp" || exit 0
          git push origin HEAD:launch-research-data
