name: spot-research

# Research only (BTC 15-minute spot-signal replay). Read-only public data; never trades,
# never alerts. Runs only on push to this research branch. Output goes to the
# spot-research-data branch.
on:
  push:
    branches: ["claude/project-thread-qagfph"]
    paths: ["research_spot/fetch.py", ".github/workflows/spot-research.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job: ["KXETH15M:ETH-USD:cb", "KXSOL15M:SOL-USD:cb", "KXXRP15M:XRP-USD:cb",
              "KXDOGE15M:DOGE-USD:cb", "KXNEAR15M:NEAR-USD:cb", "KXZEC15M:ZEC-USD:cb",
              "KXSILVER15M:SI=F:yf", "KXCOPPER15M:HG=F:yf", "KXPALLADIUM15M:PA=F:yf",
              "KXPLATINUM15M:PL=F:yf", "KXWTI15M:CL=F:yf", "KXGOLD15M:GC=F:yf"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        env:
          BUDGET_H: "3.5"
        run: python research_spot/fetch.py "${{ matrix.job }}" out
      - name: Save to spot-research-data branch
        if: always() && hashFiles('out/spot.csv.gz') != ''
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d)-$(echo "${{ matrix.job }}" | cut -d: -f1)"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6 7 8; do
            if git fetch origin spot-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/spot-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && rm -rf "runs/$stamp" && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "research output $stamp [skip ci]" || exit 0
            git push origin HEAD:spot-research-data && exit 0
            sleep $((i * 9))
          done
          exit 1
