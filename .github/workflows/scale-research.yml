name: scale-research

# Research only: capacity probe for the paper strategies. Read-only public
# data; never trades, never alerts. Runs only on push to this research branch.
# Output goes to the scale-research-data branch.
on:
  push:
    branches: ["claude/project-thread-e663jo"]
    paths: ["research_scale/probe.py", ".github/workflows/scale-research.yml"]

permissions:
  contents: write

concurrency:
  group: scale-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research_scale/probe.py out
      - name: Save to scale-research-data branch
        if: always() && hashFiles('out/log.txt') != ''
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%dT%H%MZ)"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6; do
            if git fetch origin scale-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/scale-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "scale probe $stamp" || exit 0
            git push origin HEAD:scale-research-data && exit 0
            sleep $((i * 7))
          done
          exit 1
