name: sports-research

# Research only (Kalshi sports vs sportsbook odds). Read-only public data;
# never trades, never alerts. Runs on push to this research branch only.
# Output goes to the sports-research-data branch.
on:
  push:
    branches: ["claude/project-thread-ebue60"]
    paths: ["research_sports/**", ".github/workflows/sports-research.yml"]

permissions:
  contents: write

concurrency:
  group: sports-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_sports/run.py out
      - name: Save to sports-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          if git fetch origin sports-research-data 2>/dev/null; then
            git checkout -q -B data origin/sports-research-data
          else
            git checkout -q --orphan data && git rm -rq --cached . || true
          fi
          git clean -fdxq
          mkdir -p runs && cp -r "/tmp/keep/$stamp" "runs/$stamp"
          git add runs
          git commit -qm "sports research output $stamp" || exit 0
          git push origin HEAD:sports-research-data
