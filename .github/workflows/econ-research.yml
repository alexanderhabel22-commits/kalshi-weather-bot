name: econ-research

# Research only (economic-release Kalshi markets vs public nowcasts). Read-only
# public data; never trades, never alerts. Runs on push to this research branch.
# Output goes to the econ-research-data branch.
on:
  push:
    branches: ["claude/project-thread-p5rlcc"]
    paths: ["research_econ/**", ".github/workflows/econ-research.yml"]

permissions:
  contents: write

concurrency:
  group: econ-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run
        run: python research_econ/gdpnow.py out
      - name: Save to econ-research-data branch
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp=$(date -u +%Y%m%dT%H%MZ)
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          if git fetch origin econ-research-data 2>/dev/null; then
            git checkout -q -B data origin/econ-research-data
          else
            git checkout -q --orphan data && git rm -rq --cached . || true
          fi
          git clean -fdxq
          mkdir -p runs && cp -r "/tmp/keep/$stamp" "runs/$stamp"
          git add runs
          git commit -qm "econ research output $stamp" || exit 0
          git push origin HEAD:econ-research-data
