name: pyth-probe

# Research only: probe Pyth's free price history for metals/oil (the 15-minute commodity
# markets' likely settlement source). Read-only; never trades. Output to spot-research-data.
on:
  push:
    branches: ["claude/project-thread-qagfph"]
    paths: ["research_spot/pyth.py", ".github/workflows/pyth-probe.yml"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research_spot/pyth.py out
      - name: Save
        if: always() && hashFiles('out/log.txt') != ''
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          stamp="$(date -u +%Y%m%d)-pyth"
          mkdir -p /tmp/keep && cp -r out "/tmp/keep/$stamp"
          for i in 1 2 3 4 5 6 7 8; do
            if git fetch origin spot-research-data 2>/dev/null; then
              git checkout -q -f -B data origin/spot-research-data
            else
              git checkout -q -f --orphan data && git rm -rq --cached . || true
            fi
            git clean -fdxq
            mkdir -p runs && rm -rf "runs/$stamp" && cp -r "/tmp/keep/$stamp" "runs/$stamp"
            git add runs
            git commit -qm "research output $stamp [skip ci]" || exit 0
            git push origin HEAD:spot-research-data && exit 0
            sleep $((i * 9))
          done
          exit 1
