name: weather-scan

on:
  schedule:
    # Every 5 minutes (GitHub's fastest), offset 2 minutes from the busy :00/:05 marks.
    # GitHub can still start runs late or skip one under load.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:            # "Run workflow" button (works from the GitHub app)
    inputs:
      command:
        description: "What to run"
        type: choice
        default: scan
        options: [scan, test-notify, report]

permissions:
  contents: write               # lets the bot save its ledger back to the repo

concurrency:
  group: weather-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Forecast cache survives between runs so we don't hammer the weather APIs
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: wx-cache-${{ github.run_id }}
          restore-keys: wx-cache-

      - name: Run bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BANKROLL: ${{ vars.BANKROLL }}
          RISK_LEVEL: ${{ vars.RISK_LEVEL }}
        run: python bot.py ${{ inputs.command || 'scan' }} -v

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: wx-cache-${{ github.run_id }}

      - name: Save ledger
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "bot: update ledger [skip ci]"
            git pull --rebase --autostash
            git push
          fi
